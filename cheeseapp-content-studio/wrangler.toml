name = "cheeseapp-content-studio"
main = "src/index.js"
compatibility_date = "2026-08-18"
workers_dev = false

[[routes]]
pattern = "studio.cheeseapp.org"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[services]]
binding = "CONTENT_STUDIO_API"
service = "cheeseapp-content-studio-api"
